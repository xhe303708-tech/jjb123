<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置密码 · 课笺</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@500&family=ZCOOL+KuaiLe&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="flow">
  <div class="grain"></div>
  <main class="gate">
    <form class="card" id="form">
      <a class="lbl" href="/login">← 登录</a>
      <h1>重置密码</h1>
      <label>新密码<input name="password" type="password" minlength="8" required></label>
      <p class="err" id="err"></p>
      <button class="enter" type="submit">保存并重新登录</button>
    </form>
  </main>
  <script type="module">
    const token = new URLSearchParams(location.search).get("token") || "";
    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = new FormData(event.target).get("password");
      const res = await fetch("/api/reset", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, password }) });
      const body = await res.json();
      if (!res.ok) { document.querySelector("#err").textContent = body.error || "没有重置"; return; }
      location.href = "/login";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script>anime({ targets: ".card", translateY: [28, 0], opacity: [0, 1], duration: 640, easing: "easeOutCubic" });</script>
</body>
</html>
