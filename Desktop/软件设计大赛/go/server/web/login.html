<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 课笺</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@500&family=ZCOOL+KuaiLe&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="flow">
  <div class="grain"></div>
  <main class="gate">
    <form class="card" id="form">
      <a class="lbl" href="/">← 课笺</a>
      <h1>登录</h1>
      <label>邮箱<input name="email" type="email" autocomplete="username" required></label>
      <label>密码<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="err" id="err"></p>
      <div class="row">
        <button class="enter" type="submit">进入</button>
        <a href="/forgot">忘记密码</a>
      </div>
      <div class="row"><a href="/register">注册一个账号</a><span style="font-size:12px;letter-spacing:0">演示 demo@kejian.local / kejian-demo</span></div>
    </form>
  </main>
  <script type="module">
    const next = new URLSearchParams(location.search).get("next") || "/app/home";
    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      const body = await res.json();
      if (!res.ok) { document.querySelector("#err").textContent = body.error || "没有进入"; return; }
      location.href = next.startsWith("/app") ? next : "/app/home";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script>anime({ targets: ".card", translateY: [28, 0], opacity: [0, 1], duration: 640, easing: "easeOutCubic" });</script>
</body>
</html>
