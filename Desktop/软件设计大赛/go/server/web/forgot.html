<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>忘记密码 · 课笺</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+SC:wght@500&family=ZCOOL+KuaiLe&display=swap">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="flow">
  <div class="grain"></div>
  <main class="gate">
    <form class="card" id="form">
      <a class="lbl" href="/login">← 登录</a>
      <h1>忘记密码</h1>
      <p>如果这个邮箱注册过，会准备一条 30 分钟内有效、只能用一次的重置链接。链接对应的令牌只以哈希存在数据库里。</p>
      <label>邮箱<input name="email" type="email" required></label>
      <p class="err" id="err"></p>
      <p id="link"></p>
      <button class="enter" type="submit">准备链接</button>
    </form>
  </main>
  <script type="module">
    document.querySelector("#form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const data = Object.fromEntries(new FormData(event.target));
      const res = await fetch("/api/forgot", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
      const body = await res.json();
      document.querySelector("#err").textContent = body.message || body.error || "";
      const slot = document.querySelector("#link");
      slot.innerHTML = body.reset_url ? `<a href="${body.reset_url}">本机未配置邮件，点这里重置</a>` : "";
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/animejs@3.2.2/lib/anime.min.js"></script>
  <script>anime({ targets: ".card", translateY: [28, 0], opacity: [0, 1], duration: 640, easing: "easeOutCubic" });</script>
</body>
</html>
